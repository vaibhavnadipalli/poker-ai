[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["poker"]
py-modules = ["myAI"]

[tool.setuptools.package-data]
poker = ["assets/*", "rules.yaml"]

[project]
name = "poker-ai"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0.3",
    "raylib>=5.5.0.3",
]

[project.scripts]
poker = "poker.cli:main"
